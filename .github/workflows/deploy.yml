name: Deployment Pipeline CESIZen

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy sur Serveur Linux Privé
    runs-on: self-hosted
    
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v4

      - name: Préparation du fichier .env backend
        run: |
          if [ ! -f flow-backend/.env ]; then
            cp flow-backend/.env.example flow-backend/.env
          fi
          # Forcer le nom de l'hôte MongoDB vers le conteneur Docker "mongo"
          sed -i 's/127.0.0.1:27017/mongo:27017/g' flow-backend/.env || true
          sed -i 's/localhost:27017/mongo:27017/g' flow-backend/.env || true
          echo "" >> flow-backend/.env
          echo "MONGODB_URI=mongodb://mongo:27017/flow_db" >> flow-backend/.env
          echo "MONGODB_HOST=mongo" >> flow-backend/.env

      - name: Déploiement des conteneurs Docker
        run: |
          docker compose down
          docker compose up -d --build --remove-orphans

      - name: Attente du démarrage des bases (PostgreSQL & MongoDB)
        run: sleep 10

      - name: Initialisation Laravel (Clé, Cache & Migrations)
        run: |
          docker exec cesizen_backend php artisan config:clear
          docker exec cesizen_backend php artisan key:generate --force
          docker exec cesizen_backend php artisan migrate --force
