services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: cesizen_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-flow_db}
      POSTGRES_USER: ${DB_USERNAME:-flow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - cesizen_net

  # Base de données MongoDB
  mongo:
    image: mongo:7.0
    container_name: cesizen_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - cesizen_net

# Backend API Laravel
  backend:
    build:
      context: ./flow-backend
      dockerfile: Dockerfile
    container_name: cesizen_backend
    restart: always
    env_file:
      - ./flow-backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_URI=mongodb://mongo:27017/flow_db
      - MONGO_DSN=mongodb://mongo:27017/flow_db
      - DB_DSN=mongodb://mongo:27017/flow_db
    depends_on:
      - db
      - mongo
    networks:
      - cesizen_net

  # Frontend Web Next.js
  frontend:
    build:
      context: ./flow-web
      dockerfile: Dockerfile
    container_name: cesizen_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    networks:
      - cesizen_net

networks:
  cesizen_net:
    driver: bridge

volumes:
  db_data:
  mongo_data:
